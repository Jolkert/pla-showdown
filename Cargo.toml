[package]
name = "pla_showdown"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.9.0"
lazy-regex = "3.4.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
toml = "0.8.20"
log = "0.4.27"
env_logger = "0.11.8"
dotenv = "0.15.0"
eframe = "0.31.1"
egui_extras = { version = "0.31.1", features = ["default", "image", "svg"] }
bon = "3.6.1"
itertools = "0.14.0"
strum = { version = "0.27.1", features = ["derive"] }
